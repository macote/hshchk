name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            toolchain: stable
            binary: hshchk
            artifact: linux-x64
          - name: macOS
            os: macos-latest
            toolchain: stable
            binary: hshchk
            artifact: macos-arm64
          - name: Windows MSVC
            os: windows-latest
            toolchain: stable
            binary: hshchk.exe
            artifact: windows-msvc
          - name: Windows GNU
            os: windows-latest
            toolchain: stable-x86_64-pc-windows-gnu
            binary: hshchk.exe
            artifact: windows-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install GNU compiler
        id: msys2
        if: matrix.name == 'Windows GNU'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - name: Configure GNU compiler
        if: matrix.name == 'Windows GNU'
        shell: pwsh
        run: '"${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - name: Install Rust
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - name: Run tests
        run: cargo +${{ matrix.toolchain }} test --locked --all-targets
      - name: Compile library examples
        run: cargo +${{ matrix.toolchain }} test --locked --doc
      - name: Run independent CLI workflows
        run: python tests/e2e_cli.py --binary target/debug/${{ matrix.binary }}
      - name: Check functionality inventory after tests pass
        shell: bash
        run: |
          python -m unittest discover -s scripts -p test_check_functionality.py
          cargo +${{ matrix.toolchain }} test --locked --all-targets -- --list > rust-tests.txt
          python tests/e2e_cli.py --list > e2e-tests.txt
          python scripts/check_functionality.py --rust-tests rust-tests.txt --e2e-tests e2e-tests.txt --output functionality.json
      - name: Upload functionality report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: functionality-${{ matrix.artifact }}
          path: functionality.json
          if-no-files-found: error
      - name: Upload tested CLI for hardware validation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-cli-${{ matrix.artifact }}
          path: target/debug/${{ matrix.binary }}
          if-no-files-found: error

  coverage:
    name: coverage (${{ matrix.name }}, minimum 80%)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: hshchk
          - name: Windows MSVC
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: hshchk.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install Rust coverage tools
        run: rustup toolchain install stable --profile minimal --component llvm-tools-preview
      - name: Install pinned cargo-llvm-cov binary
        id: coverage-tool
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "$RUNNER_TEMP/coverage-tools"
          gh release download v0.9.1 --repo taiki-e/cargo-llvm-cov \
            --pattern "cargo-llvm-cov-$TARGET.tar.gz" --dir "$RUNNER_TEMP/coverage-tools"
          python -c 'import sys, tarfile; tarfile.open(sys.argv[1]).extractall(sys.argv[2], filter="data")' \
            "$RUNNER_TEMP/coverage-tools/cargo-llvm-cov-$TARGET.tar.gz" "$RUNNER_TEMP/coverage-tools"
          echo "$RUNNER_TEMP/coverage-tools" >> "$GITHUB_PATH"
      - name: Run instrumented Rust and external E2E tests
        id: exercise
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
        run: |
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/coverage"
          echo "CARGO_TARGET_DIR=$CARGO_TARGET_DIR" >> "$GITHUB_ENV"
          source <(cargo llvm-cov show-env --sh)
          echo "CARGO_LLVM_COV_TARGET_DIR=$CARGO_LLVM_COV_TARGET_DIR" >> "$GITHUB_ENV"
          echo "CARGO_LLVM_COV_BUILD_DIR=$CARGO_LLVM_COV_BUILD_DIR" >> "$GITHUB_ENV"
          cargo llvm-cov clean --workspace
          cargo test --locked --all-targets
          cargo build --locked
          python tests/e2e_cli.py --binary "$CARGO_TARGET_DIR/debug/$BINARY"
      - name: Enforce production line coverage
        run: cargo llvm-cov report --json --output-path coverage/coverage.json --fail-under-lines 80
      - name: Generate readable coverage report
        if: always() && steps.exercise.outcome != 'skipped'
        run: cargo llvm-cov report --html --output-dir coverage/html
      - name: Upload coverage reports
        if: always() && steps.exercise.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.target }}
          path: coverage/
          if-no-files-found: error

  quality:
    name: formatting and clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Check Clippy
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Validate source package
        run: cargo +stable package --locked
