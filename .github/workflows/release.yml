name: release

on:
  pull_request:
    paths: ['Cargo.toml', 'Cargo.lock', 'scripts/**', '.github/workflows/release.yml']
  workflow_dispatch:
  push:
    tags: ['[0-9]*', 'v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  metadata:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Validate release version
        id: version
        env:
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python scripts/package_release.py --metadata >> "$GITHUB_OUTPUT"

  build:
    name: package (${{ matrix.target }})
    needs: metadata
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            cross: false
            smoke: true
            deb: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            cross: true
            smoke: true
            deb: true
          - target: arm-unknown-linux-gnueabihf
            os: ubuntu-22.04
            cross: true
            smoke: false
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-22.04
            cross: true
            smoke: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            cross: true
            smoke: false
          - target: x86_64-apple-darwin
            os: macos-15-intel
            cross: false
            smoke: true
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
            smoke: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
            smoke: true
          - target: i686-pc-windows-msvc
            os: windows-latest
            cross: false
            smoke: true
          - target: x86_64-pc-windows-gnu
            os: windows-latest
            cross: false
            smoke: true
            gnu: MINGW64
            gcc: mingw-w64-x86_64-gcc
          - target: i686-pc-windows-gnu
            os: windows-latest
            cross: false
            smoke: true
            gnu: MINGW32
            gcc: mingw-w64-i686-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install GNU compiler
        id: msys2
        if: matrix.gnu != ''
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: ${{ matrix.gnu }}
          install: ${{ matrix.gcc }}
      - name: Configure GNU compiler
        if: matrix.gnu != ''
        shell: pwsh
        env:
          MSYS_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          MSYSTEM: ${{ matrix.gnu }}
        run: '"$env:MSYS_LOCATION\$($env:MSYSTEM.ToLower())\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - name: Build native completion generator
        run: cargo +stable build --locked --release
      - name: Install pinned cross tool
        if: matrix.cross
        run: cargo +stable install cross --version 0.2.5 --locked
      - name: Build cross release binary
        if: matrix.cross
        run: cross +stable build --locked --release --target ${{ matrix.target }}
      - name: Build native release binary
        if: '!matrix.cross'
        run: cargo +stable build --locked --release --target ${{ matrix.target }}
      - name: Test release archive and completion scripts
        if: matrix.smoke
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          suffix=""
          case "$TARGET" in *windows*) suffix=".exe" ;; esac
          python scripts/test_package_release.py --binary "target/$TARGET/release/hshchk$suffix" --target "$TARGET"
      - name: Package and validate release assets
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.metadata.outputs.version }}
          SMOKE: ${{ matrix.smoke }}
          DEB: ${{ matrix.deb }}
        run: |
          suffix=""
          case "$TARGET" in *windows*) suffix=".exe" ;; esac
          options=()
          if [ "$SMOKE" = "true" ]; then options+=(--smoke); fi
          if [ "$DEB" = "true" ]; then options+=(--deb); fi
          python scripts/package_release.py --binary "target/$TARGET/release/hshchk$suffix" \
            --generator "target/release/hshchk$suffix" --target "$TARGET" \
            --version "$VERSION" --output-dir dist "${options[@]}"
      - name: Upload validated assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  draft-release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [metadata, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: Collect SHA256 checksums
        run: cat assets/*.sha256 > assets/SHA256SUMS
      - name: Create or update a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" --json isDraft --jq .isDraft > draft-state; then
            test "$(cat draft-state)" = true
            gh release upload "$TAG_NAME" assets/* --clobber
          else
            gh release create "$TAG_NAME" assets/* --draft --verify-tag --title "$TAG_NAME" --notes-file CHANGELOG.md
          fi
